name: Model benchmark

# Monthly (day 20, before the production runs of day 5): discover new models,
# test what changed, publish the leaderboard and results/recommendation.json.
#
# Security (SECURITY.md): the jobs that run downloaded models ("run") have a read-only token
# and hand over only their own result file; "score" accepts from each of them only the file
# named after that candidate, and is the only job that writes. Values reach the scripts
# through the environment, never pasted into them.
on:
  schedule:
    - cron: '0 4 20 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every candidate again'
        type: boolean
        default: false
      only:
        description: 'Comma-separated labels to (re)run; empty = what changed'
        required: false
        default: ''
      discover:
        description: 'Look for new models in the Ollama library'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  UPSTREAM_REPO: lsp3cesarschool/5ltep-layer3

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # latest commit when the job starts, not the one at trigger time
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover new models
        if: ${{ inputs.discover != false }}
        run: python bench/discover.py || echo "::warning::discovery failed; curated candidates only"
      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          python bench/plan.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            results/plan.json
            results/discovered.json
            results/first_seen.json

  run:
    needs: plan
    if: ${{ needs.plan.outputs.count > 0 }}
    runs-on: ubuntu-latest   # public repository: 4 vCPU / 16 GB, no minute quota
    timeout-minutes: 350
    permissions:
      contents: read          # runs a downloaded model: no write access to anything
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.entry.label }}
    env:
      ENTRY: ${{ toJSON(matrix.entry) }}
      RESULT_FILE: results/runs/${{ matrix.entry.slug }}__${{ matrix.entry.key }}.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # latest commit when the job starts, not the one at trigger time
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: upstream
          ref: ${{ matrix.entry.prompt_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Ollama
        if: ${{ matrix.entry.backend == 'ollama' }}
        uses: ./.github/actions/setup-ollama
        with:
          model: ${{ matrix.entry.model }}
          digest: ${{ matrix.entry.digest }}
      - name: llama.cpp
        if: ${{ matrix.entry.backend != 'ollama' }}
        uses: ./.github/actions/setup-llamacpp
        with:
          variant: ${{ matrix.entry.backend == 'llamacpp-prism' && 'prism' || 'official' }}
          hf_repo: ${{ matrix.entry.hf_repo }}
          hf_file: ${{ matrix.entry.hf_file }}
          sha256: ${{ matrix.entry.digest }}
      - name: Run the gold set
        run: python bench/run.py --entry "$ENTRY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.entry.slug }}
          path: ${{ env.RESULT_FILE }}   # only this candidate's own result
          if-no-files-found: ignore

  score:
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the only job that writes; it runs no model
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # latest commit when the job starts, not the one at trigger time
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results/
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: ${{ runner.temp }}/runs   # one folder per candidate, not merged
      - name: Accept each candidate's own result file only
        run: python bench/accept_runs.py "$RUNNER_TEMP/runs"
      - name: Score
        run: python bench/score.py
      - name: Commit
        run: |
          git config user.name "5L-TEP Model Benchmark Bot"
          git config user.email "5ltep-modeltest-bot@users.noreply.github.com"
          git add results/ README.md LEIAME.md candidates.json
          git diff --cached --quiet || git commit -m "chore(bench): results [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git pull --rebase --autostash
          git push
