name: Set up llama.cpp
description: >-
  Start llama-server (OpenAI-compatible API on port 8080) with one GGUF file.
  variant=official uses a pinned ggml-org build for Ubuntu x64 (CPU), checksum-verified;
  variant=prism builds the PrismML fork at a pinned commit, needed for the ternary / 1-bit
  Bonsai formats. The GGUF file is checked against the SHA-256 the plan recorded.
inputs:
  variant:
    description: official or prism
    required: true
  hf_repo:
    description: Hugging Face repository of the GGUF
    required: true
  hf_file:
    description: GGUF file name
    required: true
  sha256:
    description: Expected SHA-256 of the GGUF file (from the plan)
    required: true
runs:
  using: composite
  steps:
    - name: Official build (pinned, checksum-verified)
      if: inputs.variant == 'official'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # Update deliberately: new tag and the SHA-256 GitHub publishes for its Ubuntu x64 asset.
        LLAMACPP_TAG: b11284
        LLAMACPP_SHA256: f53f2534e7ac8df1ef056117d215f1581feb6c426310d6423efac9adcdd5c2c8
      run: |
        set -euo pipefail
        mkdir -p ~/llamacpp && cd ~/llamacpp
        asset="llama-${LLAMACPP_TAG}-bin-ubuntu-x64.tar.gz"
        gh release download "$LLAMACPP_TAG" -R ggml-org/llama.cpp --pattern "$asset"
        echo "${LLAMACPP_SHA256}  $asset" | sha256sum -c -
        tar xzf "$asset"
        server=$(find ~/llamacpp -type f -name llama-server | head -1)
        echo "SERVER=$server" >> "$GITHUB_ENV"
        echo "SERVER_LIB=$(dirname "$server")" >> "$GITHUB_ENV"

    - name: PrismML fork - cache build
      if: inputs.variant == 'prism'
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/prism-llamacpp/build/bin
        key: prism-llamacpp-88c4bc60b9c9578f134385be9535e853f2db9b9f

    - name: PrismML fork - build at a pinned commit (CPU)
      if: inputs.variant == 'prism' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PRISM_COMMIT: 88c4bc60b9c9578f134385be9535e853f2db9b9f   # update deliberately
      run: |
        set -euo pipefail
        rm -rf ~/prism-llamacpp
        git init -q ~/prism-llamacpp && cd ~/prism-llamacpp
        git fetch -q --depth 1 https://github.com/PrismML-Eng/llama.cpp "$PRISM_COMMIT"
        git checkout -q FETCH_HEAD
        [ "$(git rev-parse HEAD)" = "$PRISM_COMMIT" ]
        cmake -B build -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j 4 --target llama-server

    - name: PrismML fork - server path
      if: inputs.variant == 'prism'
      shell: bash
      run: |
        echo "SERVER=$HOME/prism-llamacpp/build/bin/llama-server" >> "$GITHUB_ENV"
        echo "SERVER_LIB=$HOME/prism-llamacpp/build/bin" >> "$GITHUB_ENV"

    - name: Download the model (checksum-verified) and start the server
      shell: bash
      env:
        HF_REPO: ${{ inputs.hf_repo }}
        HF_FILE: ${{ inputs.hf_file }}
        GGUF_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        [[ "$HF_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]] || { echo "::error::bad repository name"; exit 1; }
        [[ "$HF_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,150}\.gguf$ ]] || { echo "::error::bad file name"; exit 1; }
        [[ "$GGUF_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA-256 to check the file against"; exit 1; }
        mkdir -p ~/models
        curl -fL --retry 3 -o ~/models/model.gguf "https://huggingface.co/${HF_REPO}/resolve/main/${HF_FILE}"
        echo "${GGUF_SHA256}  $HOME/models/model.gguf" | sha256sum -c -
        ls -la ~/models
        export LD_LIBRARY_PATH="$SERVER_LIB:${LD_LIBRARY_PATH:-}"
        "$SERVER" --version || true
        nohup "$SERVER" -m ~/models/model.gguf --host 127.0.0.1 --port 8080 -c 8192 -t 4 --jinja \
          > /tmp/llama-server.log 2>&1 &
        for i in $(seq 1 300); do
          curl -sf http://127.0.0.1:8080/health && break
          sleep 2
        done
        curl -sf http://127.0.0.1:8080/health || { tail -50 /tmp/llama-server.log; exit 1; }
